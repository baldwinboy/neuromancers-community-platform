[project]
name = "neuromancers-network"
version = "0.1.0"
description = "NEUROMANCERS offers a network for users to offer and request online support"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "NEUROMANCERS", email = "hello@neuromancers.org.uk" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "babel>=2.18.0",
  "celery==5.6.3",
  "clientele[core]>=2.3.1",
  "crispy-bootstrap5==2026.9",
  "dj-stripe>=2.11.0",
  "django>=6.0,<6.1",
  "django-allauth>=65.19.7,<66",
  "django-anymail==15.2",
  "django-auditlog>=3.4.1",
  "django-celery-beat==2.9.0",
  "django-colorfield>=0.14.0,<0.15",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-filter==26.2",
  "django-fsm-2>=4.2.4",
  "django-model-utils==5.0.0",
  "django-ninja==1.7.1",
  "django-redis==7.0.0",
  "django-smart-ratelimit[redis]>=4.12.1",
  "django-storages[s3]==1.14.6",
  "django-taggit==6.1.0",
  "draftail-text-utils==3.0.0",
  "flower==2.2.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.2",
  "icalendar>=7.3.0",
  "pillow==12.3.0",
  "psycopg[c]==3.3.6",
  "python-slugify==9.1.3",
  "redis==8.1.0",
  "rules>=3.5",
  "sentry-sdk==2.71.0",
  "wagtail>=8.0,<8.1",
  "wagtail-daisie[allauth,allauth_emails,blocks,notifications]==3.0.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "clientele[cli]>=2.3.1",
  "coverage==7.16.2",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "djlint==1.46.4",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "myst-parser>=5.1.0",
  "pre-commit==4.6.2",
  "prek==0.5.5",
  "psycopg[c]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.10",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "sphinx-wagtail-theme>=6.6.0",
  "watchfiles==1.3.0",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
# H021: daisie themes intentionally emit dynamic inline styles.
ignore = "H006,H021,H030,H031,T002"
css.indent_size = 2
js.indent_size = 2

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "getpronto/*",
  "staticfiles/*",
  "whereby/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
  # Test modules use untyped factory-boy factories; not worth annotating.
  { module = [ "*.tests.*", "tests.*" ], ignore_errors = true },
  # Vendored, code-generated API clients (clientele): duplicate definitions.
  { module = [ "getpronto.*", "whereby.*" ], ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.typecheck"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.python_files = [
  "test_*.py",
  "tests.py",
]
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"

[tool.coverage]
# ==== Coverage ====
run.include = [ "neuromancers_network/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
