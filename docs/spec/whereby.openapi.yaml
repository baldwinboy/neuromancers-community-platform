  "/rooms/{roomName}/theme/tokens":
    put:
      summary: Set room colors
      description: |
        Set primary, secondary and focus room colors.
      parameters:
        - $ref: "#/components/parameters/roomName"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tokens:
                  type: object
                  description: |
                    Room colors defined in an object.
                  properties:
                    colors:
                      type: object
                      properties:
                        primary:
                          type: string
                          pattern: "#[a-fA-F0-9]{6}"
                          description: |
                            The HEX color code of the primary color.
                        secondary:
                          type: string
                          pattern: "#[a-fA-F0-9]{6}"
                          description: |
                            The HEX color code of the secondary color.
                        focus:
                          type: string
                          pattern: "#[a-fA-F0-9]{6}"
                          description: |
                            The HEX color code of the focus color.
                tokensPreset:
                  type: string
                  enum:
                    - custom
                    - default
                  description: >
                    Use the given primary or secondary colors when `custom`. Use
                    organization defaults when `default`

                    or not defined.
      responses:
        "204":
          description: The tokens were saved successfully.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/ThrottleError"
