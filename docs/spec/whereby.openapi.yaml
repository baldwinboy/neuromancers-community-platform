  /insights/rooms:
    get:
      summary: Get room insights
      description: |
        Gets a summary of insights collected for rooms.
      parameters:
        - name: roomName
          in: query
          description: Filter results by room name.
          required: false
          schema:
            type: object
            properties:
              exact:
                type: string
                description: "Example:
                  roomName[exact]=/room-prefix-793e9ec1-c686-423d-9043-9b7a10c5\
                  53fd"
              startsWith:
                type: string
                description: "Example: roomName[startsWith]=/room-prefix"
              contains:
                type: string
                description: "Example: roomName[contains]=793e9ec1"
        - name: createdAt
          in: query
          description: Filter rooms by the date they were created.
          required: false
          schema:
            type: object
            properties:
              from:
                type: string
                format: date-time
                description: "Example: createdAt[from]=2025-01-01T00:00:00.000Z"
              to:
                type: string
                format: date-time
                description: "Example: createdAt[to]=2025-05-01T00:01:00.000Z"
        - name: sortBy
          in: query
          description: Sort results by a field.
          schema:
            type: string
          required: false
          example: totalSessions:asc
        - name: cursor
          in: query
          description: >
            The cursor for paginating through the results. To fetch the next
            page,

            set the `cursor` to the `cursor` returned by the previous request.
          required: false
          schema:
            type: string
          example: 8f4031bfc7640c5f267b11b6fe0c2507
        - name: limit
          in: query
          description: Limit the number of results.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 30
      responses:
        "200":
          description: Array of sorted rooms with their insights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    type: string
                    description: >
                      The cursor for paginating through the results. To fetch
                      the next page,

                      set the `cursor` to the `cursor` returned by the previous request.

                      If there are no more results, the value returned is `null`.
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - roomName
                        - createdAt
                        - endAt
                        - firstSessionStartedAt
                        - lastSessionStartedAt
                        - totalParticipantMinutes
                        - totalRecorderMinutes
                        - totalStreamerMinutes
                        - totalUniqueParticipants
                        - totalUniqueRecorders
                        - totalUniqueStreamers
                        - totalSessions
                      properties:
                        roomName:
                          type: string
                          description: The name of the room.
                          example: /room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
                        createdAt:
                          type: string
                          description: The date the room was created.
                          example: 2025-01-01T00:00:00.000Z
                        endAt:
                          type: string
                          description: The date the room was set to expire.
                          example: 2025-01-01T01:00:00.000Z
                        firstSessionStartedAt:
                          type: string
                          description: The date the first session started in this room.
                          example: 2025-01-01T00:15:00.000Z
                        lastSessionStartedAt:
                          type: string
                          description: The date the last session started in this room.
                          example: 2025-01-01T00:45:00.000Z
                        totalParticipantMinutes:
                          type: integer
                          description:
                            The total number of minutes participants have been in the room,
                            rounded up per individual connection.
                          example: 124
                        totalRecorderMinutes:
                          type: integer
                          description: The total number of minutes the room was recorded.
                          example: 120
                        totalStreamerMinutes:
                          type: integer
                          description: The total number of minutes the room was streamed.
                          example: 120
                        totalUniqueParticipants:
                          type: integer
                          description: The total number of distinct participants in the room.
                          example: 4
                        totalUniqueRecorders:
                          type: integer
                          description: The total number of distinct recorders in the room.
                          example: 2
                        totalUniqueStreamers:
                          type: integer
                          description: The total number of distinct streamers in the room.
                          example: 1
                        totalSessions:
                          type: integer
                          description: The total number of sessions in the room.
                          example: 2
                        rating:
                          type: number
                          nullable: true
                          description:
                            Average quality rating for the last session in the room. Requires
                            session ratings to be enabled for the organization.
                          example: 4.5
                        totalRatings:
                          type: number
                          nullable: true
                          description:
                            Total number of ratings submitted for the last session in the room.
                            Requires session ratings to be enabled for the
                            organization.
                          example: 3
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/ThrottleError"
