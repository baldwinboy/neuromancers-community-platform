      parameters:
        - $ref: "#/components/parameters/roomName"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: |
                    The logo image. We recommend PNG images at least 400px wide.
          application/json:
            schema:
              type: object
              description: Reset room logo to default.
              properties:
                theme:
                  type: string
                  enum:
                    - default
                  description: Reset room logo to default.
      responses:
        "204":
          description: The logo was saved successfully.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/ThrottleError"
