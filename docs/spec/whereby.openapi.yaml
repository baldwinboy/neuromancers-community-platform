openapi: 3.0.0
info:
  title: Whereby REST API
  version: v1
  description: >
    These are the reference docs for the Whereby REST API.


    If you haven't already read our [developer documentation](

    https://docs.whereby.com/), you will want to

    read that first for a high level overview over the

    Whereby APIs.


    # Rate limiting (throttling)

    We rate limit our APIs, returning a `429` status code response when your request has been throttled.

    You will have to wait and retry the request later.


    We use a point system to limit the number of requests that you can make.  

    A read request consumes 1 point, a delete consumes 2 points and a write request consumes 3 points.  

    Here are some examples of how a 1000 point budget could be spent within **1 minute**:

    * 1000 GET requests (1000 x 1 = 1000 points)

    * 500 DELETE requests (500 x 2 = 1000 points)

    * 333 POST requests (333 x 3 = 999 points)

    * 200 DELETE + 100 POST + 300 GET requests (200 x 2 + 100 x 3 + 300 x 1 = 1000 points)


    *Grow* plans have 1000 points in total per minute, and *Build* plans have 100. The limits are global and are shared across all your API keys. Talk to us if you need higher limits.


    You may read the `Retry-After` (seconds) or `X-RateLimit-Reset` (date) response headers in order to know when you can restart your requests.

    In addition, the `X-RateLimit-Limit` header includes the total number of points for your organization, and the

    `X-RateLimit-Remaining` header displays the remaining available points.
servers:
  - url: https://api.whereby.dev/v1
    description: Production server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        The bearer token will be provided upon request and it is up to the
        client to keep it secret. Every API call needs to contain this token in
        order to authenticate and authorize the client.
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    ForbiddenError:
      description: Not allowed to perform action
    ThrottleError:
      description: You are rate limited
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error description
              data:
                type: object
                description: Extra info about the rate limit
                properties:
                  msLeft:
                    type: integer
                    description: |
                      Milliseconds left until rate limit is finished.
                      Wait this long until trying again.
            example:
              error: "Rate limit active for throttle key: organization:1"
              data:
                msLeft: 38689
    NotFoundError:
      description: The requested resource doesn't exist
  parameters:
    meetingId:
      name: meetingId
      in: path
      schema:
        type: string
      description: meeting ID.
      required: true
      example: 9cf691bf-f2d5-4420-bda9-ee8607bb558b
    roomName:
      name: roomName
      in: path
      schema:
        type: string
      description: Room name.
      required: true
      example: /room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
    recordingId:
      name: recordingId
      in: path
      schema:
        type: string
      description: Recording ID.
      required: true
      example: a56f6ad7-37fe-4a37-9319-3174630ba57a
    transcriptionId:
      name: transcriptionId
      in: path
      schema:
        type: string
      description: Transcription ID.
      required: true
      example: b438fda0-83e2-4835-92f9-c845ee3d5ea7
    summaryId:
      name: summaryId
      in: path
      schema:
        type: string
      description: Summary ID.
      required: true
      example: c429ff78-9f03-49de-b427-546bcd848050
  schemas:
    Fields:
      type: array
      items:
        type: string
        enum:
          - hostRoomUrl
          - viewerRoomUrl
      description: |
        Additional fields that should be populated.
        - `hostRoomUrl` - Include hostRoomUrl field in the meeting response.
        - `viewerRoomUrl` - Include viewerRoomUrl field in the meeting response.
    Meeting:
      type: object
      required:
        - meetingId
        - roomUrl
        - endDate
      properties:
        meetingId:
          type: string
          description: The ID of the meeting.
        roomName:
          type: string
          description: The name of the room.
          example: /room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
        roomUrl:
          type: string
          format: uri
          description: The URL to room where the meeting will be hosted.
        startDate:
          type: string
          format: date-time
          description:
            When the meeting starts. Always in UTC, regardless of the input
            timezone.
        endDate:
          type: string
          format: date-time
          description:
            When the meeting ends. Always in UTC, regardless of the input
            timezone.
        hostRoomUrl:
          type: string
          format: uri
          description: >
            The URL to the room where the meeting will be hosted which will also
            make the user the host of the

            meeting. A host will get additional privileges like locking the room, and removing and muting participants, so you should

            be careful with whom you share this URL. The user will only become a host if the meeting is on-going (some additional

            slack is added to allow a host joining the meeting ahead of time or if the meeting goes over time).

            This field is optional and will only be returned if requested through the fields parameter.
        viewerRoomUrl:
          type: string
          format: uri
          description: >
            The URL to the room where the meeting will be hosted which will make
            the user a viewer of the meeting. A viewer will not be able

            to turn on the camera or microphone, but will be able to join the meeting. This field is optional and will only be returned if requested through the fields parameter.
      example:
        meetingId: 9cf691bf-f2d5-4420-bda9-ee8607bb558b
        startDate: 2025-05-12T16:42:49Z
        endDate: 2025-05-12T17:42:49Z
        roomUrl: https://subdomain.whereby.com/room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
    Recording:
      type: object
      required:
        - recordingId
        - roomSessionId
        - filename
        - startDate
        - endDate
        - sizeInMegaBytes
      example:
        recordingId: a56f6ad7-37fe-4a37-9319-3174630ba57a
        roomSessionId: e2f29530-46ec-4cee-8b27-e565cb5bb2e9
        filename: recording.mp4
        startDate: 2025-01-01T00:00:00.000Z
        endDate: 2025-01-01T00:00:00.000Z
        sizeInMegaBytes: 100
    Transcription:
      type: object
      required:
        - transcriptionId
        - roomSessionId
        - roomName
        - startDate
        - endDate
        - state
        - createdAt
        - type
      properties:
        transcriptionId:
          type: string
          description: The ID of the transcription.
        roomSessionId:
          type: string
          description: The ID of the room session.
        filename:
          type: string
          description:
            "The filename of the transcription that was written to either
            Whereby or self hosted storage buckets (see: `storageType`)."
        roomName:
          type: string
          description: The name of the room.
        startDate:
          type: string
          format: date-time
          description:
            When the transcription starts. Always in UTC, regardless of the
            input timezone.
        endDate:
          type: string
          format: date-time
          description:
            When the transcription ends. Always in UTC, regardless of the input
            timezone.
        state:
          type: string
          enum:
            - ready
            - failed
            - in_progress
          description: |
            The state of the transcription
             - `ready` - The transcription is ready to be downloaded
             - `failed` - The transcription failed to be generated
             - `in_progress` - The transcription is still being generated
        createdAt:
          type: string
          format: date-time
          description:
            When the transcription was created. Always in UTC, regardless of
            the input timezone.
        durationInSeconds:
          type: number
          description: The total billable time in seconds for this transcription.
          example: 42
        type:
          type: string
          enum:
            - LIVE_TRANSCRIPTION
            - RECORDING_TRANSCRIPTION
          description: |-
            The type of the transcription
             - `LIVE_TRANSCRIPTION` - Session Transcription
             - `RECORDING_TRANSCRIPTION` - generated based on a recording
        storageType:
          type: string
          enum:
            - WHEREBY_HOSTED
            - SELF_HOSTED
          description: |-
            The storage type of the transcription
             - `WHEREBY_HOSTED` - files kept with Whereby
             - `SELF_HOSTED` - files stored in external location
      example:
        transcriptionId: b438fda0-83e2-4835-92f9-c845ee3d5ea7
        roomSessionId: e2f29530-46ec-4cee-8b27-e565cb5bb2e9
        roomName: /room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
        createdAt: 2025-01-01T00:00:00.000Z
        startDate: 2025-01-01T00:00:00.000Z
        endDate: 2025-01-01T00:01:00.000Z
        state: ready
        durationInSeconds: 60
        type: LIVE_TRANSCRIPTION
        filename: room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd-2025-01-01T00:00:00.000Z.md
        storageType: WHEREBY_HOSTED
    Summary:
      type: object
      required:
        - summaryId
        - transcriptionId
        - summary
        - roomSessionId
        - roomName
        - startDate
        - endDate
        - state
        - createdAt
        - modifiedAt
        - template
      example:
        summaryId: c429ff78-9f03-49de-b427-546bcd848050
        transcriptionId: b438fda0-83e2-4835-92f9-c845ee3d5ea7
        summary:
          summary: This is a meeting summary
        roomSessionId: e2f29530-46ec-4cee-8b27-e565cb5bb2e9
        roomName: /room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
        createdAt: 2025-01-01T00:00:00.000Z
        startDate: 2025-01-01T00:00:00.000Z
        endDate: 2025-01-01T00:01:00.000Z
        state: completed
        modifiedAt: 2025-01-01T00:00:00.000Z
        template: General Narrative
paths:
  /meetings:
    post:
      summary: Create meeting
      description: >
        Creates a transient room that is available between creation and an hour
        after the given end date. After this time the room will be automatically
        deleted.

        The URL to this room is present in the response.
      requestBody:
        description: Meeting to add.
        content:
          application/json:
            schema:
              type: object
              required:
                - endDate
              properties:
                endDate:
                  type: string
                  format: date-time
                  description: >
                    When the meeting ends. By default in UTC but a timezone can
                    be specified, e.g. 2025-05-07T17:42:49-05:00.

                    This has to be the same or after the current date.
                startDate:
                  type: string
                  deprecated: true
                  format: date-time
                  description: >
                    (DEPRECATED - value is ignored) Start time now defaults to
                    time of request
                isLocked:
                  type: boolean
                  description: >
                    The initial lock state of the room. If true, only hosts will
                    be able to let in other participants

                    and change lock state.
                roomMode:
                  type: string
                  default: normal
                  enum:
                    - group
                    - normal
                  example: group
                  description: >
                    The mode and size of the created transient room.

                    `normal` is the default room mode and should be used for meetings up to 4 participants.

                    `group` should be used for meetings that require more than 4 participants.
                roomNamePrefix:
                  type: string
                  maxLength: 39
                  pattern: "[a-z0-9]{0,39}"
                  example: example-prefix
                  description: >
                    This will be used as the prefix for the room name. The
                    string should be lowercase, and spaces

                    will be automatically removed. 39 character max
                roomNamePattern:
                  type: string
                  default: uuid
                  enum:
                    - uuid
                    - human-short
                  example: uuid
                  description: >
                    The format of the randomly generated room name.

                    `uuid` is the default room name pattern and follows the usual 8-4-4-4-12 pattern.

                    `human-short` generates a shorter string made up of six distinguishable characters.
                templateType:
                  type: string
                  enum:
                    - viewerMode
                  description: >
                    If provided, the room will be created with the given
                    template type.

                    Each template defines a set of properties needed for a particular use-case. Currently the only supported template type is "viewerMode". This will set up a room with properties that are

                    needed to create a viewer mode room. The room will be locked, roomMode set to "group"

                    and fields like hostRoomUrl and viewerRoomUrl will be added to the response.
                recording:
                  type: object
                  required:
                    - type
                    - destination
                    - startTrigger
                  description: |
                    Options for how a meeting should be recorded.
                  properties:
                    type:
                      type: string
                      enum:
                        - none
                        - local
                        - cloud
                      description: |
                        The type of recording that should take place.
                          "none" - Recording should be disabled
                          "local" - Recording should happen in the browser
                          "cloud" - Recording should happen in the cloud
                    destination:
                      type: object
                      required:
                        - provider
                      description: >
                        Information regarding where the recording should be
                        stored. If this is not required, or should

                        be inherited, it should be set to null.
                      properties:
                        provider:
                          type: string
                          enum:
                            - s3
                            - whereby
                          description: >-
                            The provider being used to store the stream.

                            - `s3` - Use your S3 bucket to store recordings. There are two valdidation methods for authentication. `accessKey` - The `bucket`, `region`, `accessKeyId` and `accessKeySecret` fields are required for this option. `roleBased` - The `bucket` and `oidcRoleArn` fields are required for this option.

                            - `whereby` - Store recordings on Whereby hosted storage. The `bucket`, `accessKeyId`

                            and `accessKeySecret` fields are not required for this option.
                        authenticationType:
                          type: string
                          enum:
                            - accessKey
                            - roleBased
                          description:
                            Authentication type to use for S3 storage. See
                            [here](https://docs.whereby.com/meeting-content-and-quality/authentication-for-s3-storage)
                            for more details
                        bucket:
                          type: string
                          description: >
                            The name of the s3 bucket.

                            Optionally subfolders can be also specified here, e.g. "my-bucket/recordings" will upload

                            recordings to the "recordings" folder of the "my-bucket" bucket.
                        accessKeyId:
                          type: string
                          description: |
                            The s3 access key id
                        accessKeySecret:
                          type: string
                          description: |
                            The s3 access key secret
                        fileFormat:
                          type: string
                          enum:
                            - mkv
                            - mp4
                          description: >
                            The format of the recording. By default the value
                            should be taken from the

                            organization settings.
                        oidcRoleArn:
                          type: string
                          description:
                            The role ARN for OIDC authentication. Only available when
                            `authenticationType` is set to `roleBased`
                    startTrigger:
                      type: string
                      enum:
                        - none
                        - prompt
                        - automatic
                        - automatic-2nd-participant
                      description: >
                        What type of trigger should happen in the meeting when
                        all the information required to start a

                        recording has been provided. This only has effect when recording.type is set to `"cloud"`

                        - `null` - The value should be taken from the organization settings

                        - `"none"` - A user should manually start the recording using the UI in the meeting

                        - `"prompt"` - A prompt to start the recording will be shown to the first user with permission to start
                                     the recording.
                        - `"automatic"` - The recording will be automatically started as soon as the first participant joins the
                                        meeting.
                        - `"automatic-2nd-participant"` - The recording will be automatically started as soon as the second
                                                        participant joins the meeting.
                liveTranscription:
                  type: object
                  required:
                    - destination
                    - startTrigger
                  description: |
                    A configuration object for Session Transcription
                  properties:
                    destination:
                      type: object
                      required:
                        - provider
                      description: >
                        Information regarding where the transcription should be
                        stored. If this is not required, or should

                        be inherited, it should be set to null.
                      properties:
                        provider:
                          type: string
                          enum:
                            - s3
                            - whereby
                          description: >-
                            The provider being used to store the transcript.

                            - `s3` - Use your S3 bucket to store transcriptions. There are two valdidation methods for authentication. `accessKey` - The `bucket`, `region`, `accessKeyId` and `accessKeySecret` fields are required for this option. `roleBased` - The `bucket` and `oidcRoleArn` fields are required for this option.

                            - `whereby` - Store transcriptions on Whereby hosted storage. The `bucket`, `region`, `accessKeyId`

                            and `accessKeySecret` fields are not required for this option.
                        authenticationType:
                          type: string
                          enum:
                            - accessKey
                            - roleBased
                          description:
                            "Authentication type to use for S3 storage. See here for more
                            details:
                            https://docs.whereby.com/meeting-content-and-qualit\
                            y/authentication-for-s3-storage"
                        bucket:
                          type: string
                          description: >
                            The name of the s3 bucket.

                            Optionally subfolders can be also specified here, e.g. "my-bucket/transcriptions" will upload

                            transcriptions to the "transcriptions" folder of the "my-bucket" bucket.
                        accessKeyId:
                          type: string
                          description: |
                            The s3 access key id
                        accessKeySecret:
                          type: string
                          description: |
                            The s3 access key secret
                        region:
                          type: string
                          description: |
                            The s3 region
                        oidcRoleArn:
                          type: string
                          description:
                            The role ARN for OIDC authentication. Only available when
                            `authenticationType` is set to `roleBased`
                    startTrigger:
                      type: string
                      enum:
                        - none
                        - manual
                        - automatic
                        - automatic-2nd-participant
                      description: >
                        What type of trigger should happen in the meeting when
                        all the information required to start a

                        Session Transcription has been provided.

                        - `null` - The value should be taken from the organization settings

                        - `"none"` - Session Transcription will not be available for the meeting

                        - `"manual"` - Host can manually start/stop the Session Transcription via the UI in the meeting

                        - `"automatic"` - The Session Transcription will be automatically started as soon as the first participant joins the
                                        meeting.
                        - `"automatic-2nd-participant"` - The Session Transcription will be automatically started as soon as the second
                                                        participant joins the meeting.
                    language:
                      type: string
                      enum:
                        - ca,
                        - zh,
                        - zh-TW,
                        - cs,
                        - da,
                        - nl,
                        - en,
                        - en-US,
                        - en-GB,
                        - fi,
                        - fr,
                        - de,
                        - de-CH,
                        - el,
                        - hi,
                        - id,
                        - it,
                        - ja,
                        - ko,
                        - lv,
                        - ms,
                        - no,
                        - pl,
                        - pt,
                        - pt-BR,
                        - ro,
                        - ru,
                        - sk,
                        - es,
                        - sv,
                        - th,
                        - uk,
                        - vi,
                      description: >
                        What language should be used for the Session
                        Transcription.

                        - `null` - The value should be taken from the organization settings
                    liveCaptions:
                      type: boolean
                      description: >
                        If true, live captions will be enabled for the meeting.
                        This will be available for all participants.
                streaming:
                  type: object
                  required:
                    - destination
                    - startTrigger
                  description: >
                    A configuration object for live RTMP streaming of the meeting
                  properties:
                    destination:
                      type: object
                      required:
                        - url
                      description: |
                        The destination of the stream
                      properties:
                        url:
                          type: string
                          description: >
                            The destination RTMP URI of the stream. This should
                            be set to match the inject url of your streaming
                            provider (Youtube, Facebook, Twitch, etc). Example
                            `rtmp://a.rtmp.youtube.com/live2/<stream_key>`
                    startTrigger:
                      type: string
                      enum:
                        - none
                        - prompt
                        - automatic
                      description: >
                        Specify the condition when live streaming should be
                        started.- `null` - Should be passed when this is not
                        required or should be inherited

                        from the organization preferences

                        -  `none` - The meeting host is able to manually start and stop the stream.

                        -  `prompt` - The meeting host will be prompted to start the stream once joined.

                        -  `automatic` - The stream will be automatically started as soon as the first participant joins the
                                        meeting.
                fields:
                  $ref: "#/components/schemas/Fields"
      responses:
        "201":
          description: The resource was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/ThrottleError"
    get:
      summary: Get meetings
      description: |
        Returns a list of meetings.
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            description: >
              The cursor for paginating through the results. To fetch the next
              page,

              set the `cursor` to the `cursor` returned by the previous request.
            example: 8f4031bfc7640c5f267b11b6fe0c2507
        - in: query
          name: limit
          schema:
            type: integer
            description:
              The limit for the pagination - the maximum number of results that
              will be returned within a single API response.
            default: 50
            maximum: 100
            minimum: 1
        - in: query
          name: fields
          schema:
            $ref: "#/components/schemas/Fields"
          explode: false
          style: form
      responses:
        "200":
          description:
            A JSON object with the page containing the array with the meetings
            results.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - cursor
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Meeting"
                  cursor:
                    type: string
                    description: >
                      The cursor for paginating through the results. To fetch
                      the next page,

                      set the `cursor` to the `cursor` returned by the previous request.

                      If there are no more results, the value returned is `null`.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/ThrottleError"
  "/meetings/{meetingId}":
    delete:
      summary: Delete meeting
      description: >
        Deletes the specified meeting. The endpoint is idempotent, meaning it
        will return the same response even if the meeting has already been
        deleted.
      parameters:
        - $ref: "#/components/parameters/meetingId"
      responses:
        "204":
          description: The resource was deleted successfully.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/ThrottleError"
    get:
      summary: Get meeting
      description: |
        Returns the specified meeting.
      parameters:
        - $ref: "#/components/parameters/meetingId"
        - in: query
          name: fields
          schema:
            $ref: "#/components/schemas/Fields"
          explode: false
          style: form
      responses:
        "200":
          description: A JSON object representing the meeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/ThrottleError"
  /recordings:
    get:
      summary: Get recordings
      description: |
        Returns the recordings.
      parameters:
        - in: query
          name: roomName
          schema:
            type: string
            description: The name of the room
        - in: query
          name: cursor
          schema:
            type: string
            description: >
              The cursor for paginating through the results. To fetch the next
              page,

              set the `cursor` to the `cursor` returned by the previous request.
            example: 8f4031bfc7640c5f267b11b6fe0c2507
        - in: query
          name: limit
          schema:
            type: integer
            description:
              The limit for the pagination - the maximum number of results that
              will be returned within a single API response.
            default: 50
            maximum: 100
            minimum: 1
        - name: sortBy
          in: query
          description:
            "Sort results by a field. Accepted fields are: `roomName`,
            `startDate`, `duration` and `sizeInMegaBytes`. Accepted sort values
            are 'asc' and 'desc'."
          schema:
            type: string
          required: false
          example: roomName:asc
      responses:
        "200":
          description: A JSON object with the page containing the array with the
            recordings results.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - cursor
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recording"
                  cursor:
                    type: string
                    description: >
                      The cursor for paginating through the results. To fetch
                      the next page,

                      set the `cursor` to the `cursor` returned by the previous request.

                      If there are no more results, the value returned is `null`.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/ThrottleError"
  "/recordings/{recordingId}":
    delete:
      summary: Delete recording
      description: >
        Deletes the specified recording. The endpoint is idempotent, meaning it
