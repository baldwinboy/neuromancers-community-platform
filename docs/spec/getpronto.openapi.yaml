openapi: 3.1.0
paths:
  /upload/presign:
    post:
      summary: Get a presigned upload URL
      tags:
        - Files
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                mimetype:
                  type: string
                size:
                  type: number
                customFilename:
                  type: string
                folderName:
                  type: string
              required:
                - filename
                - mimetype
                - size
      responses:
        "200":
          description: Presigned URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  pendingUploadId:
                    type: string
                  expiresIn:
                    type: number
                required:
                  - uploadUrl
                  - pendingUploadId
                  - expiresIn
        "401":
          description: Unauthorized
  /upload/confirm:
    post:
      summary: Confirm a file upload
      tags:
        - Files
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pendingUploadId:
                  type: string
              required:
                - pendingUploadId
      responses:
        "200":
          description: Upload confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  file:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      secureUrl:
                        type: string
                      secureThumbnailUrl:
                        type: string
                      rawUrl:
                        type: string
                      type:
                        type: string
                      rawType:
                        type: string
                      size:
                        type: string
                      rawSize:
                        type: number
                      updated:
                        type: string
                      rawUpdated:
                        type: string
                      folderId:
                        types:
                          - "null"
                          - string
                    required:
                      - id
                      - name
                      - secureUrl
                      - secureThumbnailUrl
                      - rawUrl
                      - type
                      - rawType
                      - size
                      - rawSize
                      - updated
                      - rawUpdated
                      - folderId
                required:
                  - message
                  - file
        "400":
          description: Invalid upload ID
        "401":
          description: Unauthorized
  /files:
    get:
      summary: List files
      tags:
        - Files
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: number
          description: Page number
        - in: query
          name: pageSize
          required: false
          schema:
            type: number
          description: Number of items per page
        - in: query
          name: folderName
          required: false
          schema:
            type: string
          description: Filter by folder name
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        secureUrl:
                          type: string
                        secureThumbnailUrl:
                          type: string
                        rawUrl:
                          type: string
                        type:
                          type: string
                        rawType:
                          type: string
                        size:
                          type: string
                        rawSize:
                          type: number
                        updated:
                          type: string
                        rawUpdated:
                          type: string
                        folderId:
                          types:
                            - "null"
                            - string
                      required:
                        - id
                        - name
                        - secureUrl
                        - secureThumbnailUrl
                        - rawUrl
                        - type
                        - rawType
                        - size
                        - rawSize
                        - updated
                        - rawUpdated
                        - folderId
                  pagination:
                    type: object
                    properties:
                      page:
                        type: number
                      pageSize:
                        type: number
                      totalCount:
                        type: number
                      totalPages:
                        type: number
                    required:
                      - page
                      - pageSize
                      - totalCount
                      - totalPages
                required:
                  - files
                  - pagination
        "401":
          description: Unauthorized
  "/files/{id}":
    get:
      summary: Get file metadata
      tags:
        - Files
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: File ID
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  secureUrl:
                    type: string
                  secureThumbnailUrl:
                    type: string
                  rawUrl:
                    type: string
                  type:
                    type: string
                  rawType:
                    type: string
                  size:
                    type: string
                  rawSize:
                    type: number
                  updated:
                    type: string
                  rawUpdated:
                    type: string
                  folderId:
                    types:
                      - "null"
                      - string
                required:
                  - id
                  - name
                  - secureUrl
                  - secureThumbnailUrl
                  - rawUrl
                  - type
                  - rawType
                  - size
                  - rawSize
                  - updated
                  - rawUpdated
                  - folderId
        "401":
          description: Unauthorized
        "404":
          description: File not found
    delete:
      summary: Delete a file
      tags:
        - Files
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: File ID
      responses:
        "204":
          description: File deleted
        "401":
          description: Unauthorized
        "404":
          description: File not found
  "/file/{id}/transform-url":
    post:
      summary: Get an image transformation URL
      tags:
        - Images
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: File ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                w:
                  type: number
                h:
                  type: number
                fit:
                  type: string
                  enum:
                    - cover
                    - contain
                    - fill
                    - inside
                    - outside
                q:
                  type: number
                blur:
                  type: number
                sharp:
                  type: boolean
                gray:
                  type: boolean
                rot:
                  type: number
                border:
                  type: string
                crop:
                  type: string
                format:
                  type: string
                  enum:
                    - jpeg
                    - jpg
                    - png
                    - webp
                    - avif
              required: []
      responses:
        "200":
          description: Transformation URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url
        "401":
          description: Unauthorized
        "404":
          description: File not found
components:
  schemas: {}
info:
  title: GetPronto API
  version: 1.0.0
  description: File upload, management, and image transformation API
  contact:
    name: GetPronto
    url: https://www.getpronto.io
servers:
  - url: https://api.getpronto.io/v1
    description: Production server
