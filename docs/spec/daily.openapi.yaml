      properties:
        version:
          type: string
          description: The semantic version of the current message.
        type:
          type: string
          description: The type of event that is being provided.
          enum:
            - participant.joined
        event_ts:
          type: number
          description:
            The Unix epoch time in seconds representing when the event was
            generated.
        payload:
          description: The payload of the object, describing the given event.
          type: object
          additionalProperties: false
          properties:
            joined_at:
              type: number
              description:
                The Unix epoch time in seconds representing when the participant
                joined.
            session_id:
              type: string
              description: The user session ID, or participant id.
            room:
              type: string
              description: The name of the room.
            user_id:
              type: string
              description:
                The ID of the user. This is the `user_id` you set on their meeting
                token. If the participant joined without a meeting token, this
                field is left out of the payload. SIP and PSTN participants get
                this from their dial-in or dial-out setup instead.
            user_name:
              type: string
              nullable: true
              description:
                The participant's current name. It starts out as the `user_name`
                from their meeting token, or the `userName` call property if
                they joined without one, and if the name is changed later with
                `setUserName()` the webhook sends the new name. `null` when no
                name is set.
            userData:
              description:
                Any custom JSON data set for this participant, from the `userData`
                call property at join or from `setUserData()` later. It does not
                come from the meeting token. Left out of the payload when no
                user data is set.
            participantType:
              type: string
              description:
                Only sent for SIP and PSTN participants. Regular web participants
                do not have this field.
              enum:
                - sip-dial-in
                - sip-dial-out
                - pstn-dial-in
                - pstn-dial-out
                - unknown
            owner:
              type: boolean
              description: A flag determining if this user is considered the owner.
            will_eject_at:
              type: number
              nullable: true
              description:
                The Unix epoch time in seconds representing when the participant
                will be ejected. `null` when no ejection is scheduled, which is
                the usual case.
            permissions:
              type: object
              description:
                The permissions object, that describes what the participant is
                permitted to do during this call.
              additionalProperties: false
              properties:
                hasPresence:
                  type: boolean
                  description: Determines whether the participant is "present" or "hidden"
                canSend:
                  type: array
                  description:
                    Array of strings identifying which types of media the participant
                    can send or a boolean to grant/revoke permissions for all
                    media types.
                  items:
                    type: string
                canReceive:
                  type: object
                  description: >-
                    Which media the participant should be permitted to receive. 


                    [See here for `canReceive` object format](/products/daily-js/instance-methods/participants#permissionscanreceive-properties).
                canAdmin:
                  type: array
                  description:
                    Array of strings identifying which types of admin tasks the
                    participant can do or a boolean to grant/revoke permissions
                    for all types.
                  items:
                    type: string
