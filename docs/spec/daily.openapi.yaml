  /:
    get:
      summary: Get domain configuration
      description: Get top-level configuration of your domain
      operationId: GetDomainConfig
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Example Response:
                  value:
                    domain_name: api-test-1
                    domain_id: 30f866c3-9123-452a-8723-ff58322d09c5
                    config:
                      redirect_on_meeting_exit: ""
                      hide_daily_branding: false
                      hipaa: false
                      intercom_auto_record: false
                      lang: en
                      meeting_join_hook: ""
              schema:
                description: ""
                type: object
                x-examples:
                  example-1:
                    domain_name: your-domain
                    domain_id: 8cbd738e1-6a95-47f1-a517-0a19s328a79
                    config:
                      hide_daily_branding: true
                      redirect_on_meeting_exit: ""
                      meeting_join_hook: ""
                      hipaa: false
                      intercom_auto_record: false
                      intercom_manual_record: ""
                      sfu_impl: s
                      sfu_switchover: null
                      switchover_impl: null
                      lang: null
                      max_api_rooms: null
                      webhook_meeting_end: null
                      recordings_bucket: null
                      max_live_streams: 20
                      max_streaming_instances_per_room: 1
                      enable_daily_logger: true
                      enable_prejoin_ui: true
                      enable_live_captions_ui: false
                      enable_network_ui: false
                      disable_rate_limiting: false
                      attach_callobject_to_window: false
                properties:
                  domain_name:
                    type: string
                    minLength: 1
                  domain_id:
                    type: string
                    minLength: 1
                  config:
                    type: object
                    properties:
                      hide_daily_branding:
                        type: boolean
                        description: Whether "Powered by Daily" displays in the in-call UI.
                      redirect_on_meeting_exit:
                        type: string
                        description: >-
                          (For meetings that open in a separate browser tab.)
                          When a user clicks on the in-call menu bar's "leave
                          meeting" button, the browser loads this URL. A query
                          string that includes a parameter of the form
                          `recent-call=<domain>/<room>` is appended to the URL.
                          On mobile, you can redirect to a deep link to bring a
                          user back into your app.


                          If `redirect_on_meeting_exit_allowed_hosts` is set on your domain, this destination must be permitted by that allowlist, or the redirect is dropped and the participant is not redirected on leaving.
                      redirect_on_meeting_exit_allowed_hosts:
                        type: array
                        items:
                          type: string
                        description:
                          Optional allowlist restricting where `redirect_on_meeting_exit` may
                          send participants, including from [self-signed
                          tokens](/docs/guides/privacy-and-security/self-signing-tokens).
                          Unset (the default) permits any destination; an empty
                          array permits none. Entries are hostnames, optionally
                          prefixed with `*.` to match subdomains, or a bare URL
                          scheme ending in `:` for mobile app deep links, e.g.
                          `["app.example.com", "*.example.com", "myapp:"]`.
                      meeting_join_hook:
                        type: string
                        description: >-
                          Sets a URL that will receive a webhook when a user
                          joins a room.


                          ⚠️ In place of the `meeting_join_hook`, we recommend setting up a [webhook](/products/rest-api/webhooks) and listening for the [`participant.joined`](/products/rest-api/webhooks/events/participant-joined) event.
                      hipaa:
                        type: boolean
                        description:
                          Email us at help@daily.co to turn on HIPAA. Learn more about [our
                          HIPAA
                          compliance](https://www.daily.co/hipaa-compliance).
                      intercom_auto_record:
                        type: boolean
                        description: >-
                          Whether to automatically start recording when an
                          Intercom support agent joins an Intercom-created call.
                          Please see our [Intercom Messenger App
                          page](https://www.daily.co/intercom) for more
                          information. 


                          ⚠️This method is read-only; please contact us if you'd like to enable intercom call auto-recording.
                      intercom_manual_record:
                        type: string
                      sfu_impl:
                        type: string
                        minLength: 1
                      sfu_switchover:
                        type: integer
                      switchover_impl:
                        type: string
                      lang:
                        type: string
                        description: >-
                          The default language for the video call UI, for all
                          calls. 


                          If you set the language at this domain level, you can still override the setting for specific rooms in [a room's configuration properties](/products/rest-api/rooms/config), or for a specific participant in a [meeting token](/products/rest-api/meeting-tokens/config). 


                          You can also set the language dynamically using the front-end library [setDailyLang() method](/products/daily-js/instance-methods/set-daily-lang).


                          `*` Norwegian `"no"` and Russian `"ru"` are only available in the new Daily Prebuilt.
                      webhook_meeting_end:
                        type: string
                      recordings_bucket:
                        type: object
                        properties:
                          bucket_name:
                            type: string
                          bucket_region:
                            type: string
                      max_live_streams:
                        type: number
                      max_streaming_instances_per_room:
                        type: number
                      enable_daily_logger:
                        type: boolean
                      enable_prejoin_ui:
                        type: boolean
                        description: >-
                          Determines whether participants enter a waiting room
                          with a camera, mic, and browser check before joining a
                          call in any room under this domain. 


                          ⚠️ You must be using [Daily Prebuilt](https://daily.co/blog/daily-prebuilt-video-chat) to use `enable_prejoin_ui`.
                      enable_live_captions_ui:
                        type: boolean
                        description: >-
                          Sets whether participants in a room see a closed
                          captions button in their Daily Prebuilt call tray.
                          When the closed caption button is clicked, closed
                          captions are displayed locally.


                          When set to `true`, a closed captions button appears in the call tray. When set to `false`, the closed captions button is hidden from the call tray.


                          Note: Transcription must be enabled for the room or users must have permission to start transcription for this feature to be enabled. View the [transcription guide](/guides/products/transcription) for more details.


                          ⚠️ You must be using [Daily Prebuilt](https://daily.co/blog/daily-prebuilt-video-chat) to use `enable_live_captions_ui`.
                      enable_network_ui:
                        type: boolean
                        description: >-
                          Determines whether the network button, and the network
                          panel it reveals on click, appears across all rooms
                          belonging to this domain. 


                          ⚠️ You must be using [Daily Prebuilt](https://daily.co/blog/daily-prebuilt-video-chat) to use `enable_network_ui`.
                      disable_rate_limiting:
                        type: boolean
                      attach_callobject_to_window:
                        type: boolean
                      enable_raw_tracks_transcoded_audio:
                        type: string
                        enum:
                          - aac
                          - wav
                          - wav-48k
                          - wav-48k-stereo
                          - wav-48k-mono
                          - wav-44k1
                          - wav-44k1-stereo
                          - wav-44k1-mono
                          - ""
                        description: >-
                          Enable gapless transcoded audio for `raw-tracks`
                          recordings in all rooms under this domain. When set,
                          each participant's audio track is decoded, gaps (muted
                          mic, idle periods, packet loss) are filled with
                          silence, and the track is re-encoded as a continuous
                          file. Affects audio tracks only; video tracks still
                          record as `.webm`. A room value takes priority over
                          this domain value.


                          Supported values:


                          * `aac`: AAC at 160 kbps, 48 kHz stereo, in an MP4 container.

                          * `wav-48k-stereo` (aliases `wav` and `wav-48k`): 16-bit PCM WAV, 48 kHz stereo.

                          * `wav-48k-mono`: 16-bit PCM WAV, 48 kHz mono.

                          * `wav-44k1-stereo` (alias `wav-44k1`): 16-bit PCM WAV, 44.1 kHz stereo.

                          * `wav-44k1-mono`: 16-bit PCM WAV, 44.1 kHz mono.


                          Leave unset to keep the default Opus audio in a `.webm` container. See the [recording guide](/docs/guides/features/recording#gapless-transcoded-audio).
        "400":
          $ref: "#/components/responses/400"
      deprecated: false
      tags:
        - domain
      security:
        - bearerAuth: []
