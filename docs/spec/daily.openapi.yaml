  "/recordings/{recording_id}/access-link":
    get:
      summary: recordings/:id/access-link
      description:
        "Generate an access link for a recording. The `download_link` is a
        short-lived signed URL: see the [access links
        guide](/docs/rest-api/access-links) for more information."
      operationId: GetRecordingLink
      parameters:
        - name: recording_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: valid_for_secs
          in: query
          description: >-
            How long the returned `download_link` remains valid, in seconds.
            Accepts 900 (15 minutes) through 43200 (12 hours). A value outside
            that range returns a `400`.


            Read the response's `expires` field rather than adding `valid_for_secs` to the current time. `expires` is the Unix timestamp at which the link stops working, and it is authoritative when Daily grants a shorter lifetime than the one requested.


            Recordings stored in your own Amazon S3 bucket have a maximum link lifetime of 3600 seconds. A larger `valid_for_secs` still returns a `200`, with `expires` set one hour out and `validity_capped` set to `true`. Request a new link when you need the file again. Recordings in Daily storage and in customer-owned OCI Object Storage buckets are not affected. See [Custom S3 storage](/docs/guides/features/recording/custom-s3-storage#download-link-lifetime).
          required: false
          style: form
          explode: true
          schema:
            type: integer
            format: int32
            minimum: 900
            maximum: 43200
            default: 3600
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_link:
                    $ref: "#/components/schemas/signed_recording_link"
                  expires:
                    type: integer
                    example: 1548809176
                    default: 0
                  storage_provider:
                    type: string
                    enum:
                      - aws
                      - oci
                    description:
                      The storage provider the recording was written to. `aws` for Amazon
                      S3 (including Daily's own storage), `oci` for OCI Object
                      Storage.
                    example: aws
                  validity_capped:
                    type: boolean
                    description:
                      Present and `true` only when the requested `valid_for_secs`
                      exceeded the maximum lifetime allowed for where this
                      recording is stored, and the link was signed for the
                      shorter lifetime instead. Absent otherwise. `expires`
                      always reports the lifetime actually granted, so a client
                      that reads `expires` needs no special handling for this
                      case.
                    example: true
              examples:
                Result:
                  value:
                    download_link: https://b.daily.co/recordings/api-demo/hello/1548790973821?dl=api-demo%2Fhello%2F1548790973821.webm&Expires=1548809176&Signature=Gt5RhZ0kXksNriqmlm~T9hbq-asExampleSignature_&Key-Pair-Id=K1EXAMPLEKEYPAIR
                    expires: 1548809176
                    storage_provider: aws
        "400":
          $ref: "#/components/responses/400"
      deprecated: false
      tags:
        - recordings
      security:
        - bearerAuth: []
