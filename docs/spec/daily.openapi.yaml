    dialout-properties:
      properties:
        sipUri:
          description:
            sipUri to call. uri should start with `sip:`. Query parameters
            appended to the sipUri will appear as SIP Headers in the INTIVE
            message at the remote SIP endpoint. Headers must start with "X-",
            e.g. to append a header "myexampleHeader" it is appended to sipUri
            as "sip:<dialout_sip_uri>?X-header-1=val-1&X-header-2=val-2".
          type: string
        phoneNumber:
          description: phone number to call. number must start with country code e.g `+1`
          type: string
        extension:
          description: the extension to dial after dialed number is connected. e.g. `1234`
          type: string
        waitBeforeExtensionDialSec:
          description:
            number of seconds to wait before dialing the extension, once dialed
            number is connected.
          type: integer
          default: 0
          minimum: 0
          maximum: 60
        displayName:
          description:
            The sipUri or The phone participant is shown with this name in the
            web UI.
          type: string
        userId:
          description: userId to assign to the participant. default `userId` is null.
          type: string
        callerId:
          description:
            determine the phone number used for outbound call (i.e. phone
            number displayed on the called phone). [purchased
            phone](/products/rest-api/phone-numbers/purchased-phone-numbers)
          type: string
        video:
          description: Enable SIP video in the room, only available for sipUri.
          type: boolean
        videoSettings:
          description: Video encoding settings. Only applicable when `video` is `true`.
          type: object
          properties:
            width:
              description: "Video width in pixels. Default: 1280. Maximum: 1280."
              type: integer
              default: 1280
              minimum: 1
              maximum: 1280
            height:
              description: "Video height in pixels. Default: 720. Maximum: 720."
              type: integer
              default: 720
              minimum: 1
              maximum: 720
            fps:
              description: "Video frame rate. Default: 15. Maximum: 30."
              type: integer
              default: 15
              minimum: 1
              maximum: 30
            videoBitrate:
              description: "Video bitrate in kbps. Default: 900. Maximum: 1000."
              type: integer
              default: 900
              minimum: 1
              maximum: 1000
        codecs:
          description: Specify the codecs to use for dial-out.
          type: object
          properties:
            audio:
              description:
                Specify the audio codecs to use for dial-out. Default codec is
                PCMU/PCMA. If the set codec is not supported by the remote
                party, the media stream will be transcoded and a transcoding
                charge will be applied. ['OPUS', 'G722', 'PCMU', 'PCMA']
              type: array
              items:
                type: string
                example:
                  - OPUS
                  - G722
                  - PCMU
                  - PCMA
                enum:
                  - OPUS
                  - G722
                  - PCMU
                  - PCMA
            video:
              description:
                Specify the video codecs to use for dial-out. Default coded is VP8.
                If the set codec is not supported by the remote party, the media
                stream will be transcoded and a transcoding charge will be
                applied. ['H264', 'VP8'].
              type: array
              items:
                type: string
                example:
                  - H264
                  - VP8
                enum:
                  - H264
                  - VP8
      additionalProperties: false
      type: object
    properties:
      type: object
      additionalProperties: false
      properties:
        room_name:
          type: string
          description:
            The room for which this token is valid. If `room_name` isn't set,
            the token is valid for all rooms in your domain. *You should always
            set `room_name` if you are using this token to control access to a
            meeting.
        eject_at_token_exp:
          type: boolean
          default: false
          description: >-
            Kick this user out of the meeting at the time this meeting token
            expires. If either this property or `eject_after_elapsed` are set
            for the token, the room's `eject` properties are overridden.


            _See an example in our [advanced security tutorial](https://www.daily.co/blog/add-advanced-security-features-to-video-chats-with-the-daily-api/)_.
        eject_after_elapsed:
          type: integer
          format: int32
          description: >-
            Kick this user out of the meeting this many seconds after they join
            the meeting. If either this property or `eject_at_token_exp` are set
            for the token, the room's `eject` properties are overridden.


            _See an example in our [advanced security tutorial](https://www.daily.co/blog/add-advanced-security-features-to-video-chats-with-the-daily-api/)_.
        nbf:
          type: integer
          format: int32
          description: '"Not before". This is a [unix
            timestamp](https://stackoverflow.com/questions/20822821/what-is-a-unix-timestamp-and-why-use-it)
            (seconds since the epoch.) Users cannot join a meeting in with this
            token before this time.'
        exp:
          type: integer
          format: int32
          description: >-
            "Expires". This is a unix timestamp (seconds since the epoch.) Users
            cannot join a meeting with this token after this time.


            Daily strongly recommends adding an `exp` value to all meeting tokens. Learn more in our Daily blog post: [Add advanced security to video chats with the Daily API](https://www.daily.co/blog/add-advanced-security-features-to-video-chats-with-the-daily-api/)
        is_owner:
          type: boolean
          default: false
          description: The user has [meeting owner
            privileges](/docs/guides/privacy-and-security/controlling-who-joins-a-meeting#meeting-owner-privileges).
            For example, this user can send video, audio, and screenshare, and
            can perform administrative actions like muting other participants.
        user_name:
          type: string
          description:
            The user's name in this meeting. The name displays in the user
            interface when the user is muted or has turned off the camera, and
            in the chat window. This username is also saved in the meeting
            events log (meeting events are retrievable using the
            [analytics](/products/rest-api/meetings) API methods.)
        user_id:
          type: string
          description: >-
            The user's ID for this meeting session. During a session, this ID is
            retrievable in the
            [`participants()`](/products/daily-js/instance-methods/participants)
            method and [related participant
            events](/products/daily-js/events/participant-events). Either during
            or after a session concludes, this ID is retrievable using the
            [/meetings](/products/rest-api/meetings) REST API endpoint. You can
            use `user_id` to map between your user database and meeting
            events/attendance.


            For domains configured for [HIPAA compliance](/guides/privacy-and-security/hipaa), if the `user_id` value is a [UUID](https://www.ietf.org/rfc/rfc4122.txt) (for example, `f81d4fae-7dec-11d0-a765-00a0c91e6bf6`), then the UUID will be returned for the participant in the [`/meetings`](/products/rest-api/meetings) REST API endpoint. Otherwise, the string `hipaa` will be returned in order to remove potential PHI. During a session, the provided `user_id` will always be returned through the `participants()` method and related events, regardless of the `user_id` value.


            The `user_id` has a limit of 36 characters.
        enable_screenshare:
          type: boolean
          default: true
          description:
            Sets whether or not the user is allowed to screen share. This
            setting applies for the duration of the meeting. If you're looking
            to dynamically control whether a user can screen share during a
            meeting, then use the
            [`permissions`](/products/rest-api/meeting-tokens/config#permissions)
            token property.
        start_video_off:
          type: boolean
          default: false
          description:
            Disable the default behavior of automatically turning on a
            participant's camera on a direct `join()` (i.e. without
            `startCamera()` first).
        start_audio_off:
          type: boolean
          default: false
          description:
            Disable the default behavior of automatically turning on a
            participant's microphone on a direct `join()` (i.e. without
            `startCamera()` first).
        enable_recording:
          description: Jump to [recording docs](/products/rest-api/recordings).
          oneOf:
            - type: string
              enum:
                - cloud
                - cloud-audio-only
                - local
                - raw-tracks
            - type: array
              uniqueItems: true
              items:
                type: string
                enum:
                  - cloud
                  - cloud-audio-only
                  - local
                  - raw-tracks
        enable_prejoin_ui:
          type: boolean
          description: >-
            Determines whether the participant using the meeting token enters a
            waiting room with a camera, mic, and browser check before joining a
            call. If this property is also set in the room or domain's
            configuration, the meeting token's configuration will take priority.


            ⚠️ You must be using [Daily Prebuilt](https://daily.co/prebuilt) to use `enable_prejoin_ui`.
        enable_live_captions_ui:
          type: boolean
          description: >-
            Sets whether the participant sees a closed captions button in their
            Daily Prebuilt call tray. When the closed caption button is clicked,
            closed captions are displayed locally.


            When set to `true`, a closed captions button appears in the call tray. When set to `false`, the closed captions button is hidden from the call tray.


            Note: Transcription must be enabled for the room or users must have permission to start transcription for this feature to be enabled. View the [transcription guide](/guides/products/transcription) for more details.


            ⚠️ You must be using [Daily Prebuilt](https://daily.co/blog/daily-prebuilt-video-chat) to use `enable_live_captions_ui`.
        enable_recording_ui:
          type: boolean
          description: >-
            Determines whether the participant using the meeting token can see
            the Recording button in Daily Prebuilt's UI, which can be found in
            the video call tray. If this value is `false`, the button will not
            be included in the tray. If it's `true`, the Recording button will
            be displayed.


            This option is useful when only specific call participants should have recording permissions.

             ⚠️ You must be using [Daily Prebuilt](https://daily.co/prebuilt) to use `enable_recording_ui`.
        enable_terse_logging:
          $ref: "#/components/schemas/enable_terse_logging"
        knocking:
          type: boolean
          default: false
          description:
            Requires the `enable_knocking` property to be set on the room. By
            default, if a user joins a room with `enable_knocking` set, and with
            a token, they will bypass the waiting screen and join the room
            directly. If this property is set to `true`, the user will be
            required to request access, and the owner will need to accept them
            before they can join.
        start_cloud_recording:
          type: boolean
          default: false
          x-paidPlan: paid
          description: >-
            Start cloud recording when the user joins the room. This can be used
            to always record and archive meetings, for example in a customer
            support context.


            Note: This requires the `enable_recording` property of the room or token to be set to `cloud`. If you want to automatically record calls with other recording modes, use `callObject.startRecording()` after `await callObject.join()` in your code.
        start_cloud_recording_opts:
          type: object
          x-paidPlan: paid
          description: >-
            Options for use when `start_cloud_recording` is `true`. See
            [`startRecording`](/products/daily-js/instance-methods/start-recording)
            for available options.


            ⚠️ Specifying too many options may cause the token size to be very large. It is recommended to use token less than 2048 characters. For complex usecases, use the daily-js API.
        auto_start_transcription:
          type: boolean
          default: false
          x-paidPlan: paid
          description:
            Start transcription when an owner joins the room. This property can
            be used to always transcribe meetings once an owner joins.
        close_tab_on_exit:
          type: boolean
          default: false
          description:
            (For meetings that open in a separate browser tab.) When a user
            leaves a meeting using the button in the in-call menu bar, the
            browser tab closes. This can be a good way, especially on mobile,
            for users to be returned to a previous website flow after a call.
        redirect_on_meeting_exit:
          type: string
          description: >-
            (For meetings that open in a separate browser tab.) When a user
            leaves a meeting using the button in the in-call menu bar, the
            browser loads this URL. A query string that includes a parameter of
            the form `recent-call=<domain>/<room>` is appended to the URL. On
            mobile, you can redirect to a deep link to bring a user back into
            your app.


            If the [`redirect_on_meeting_exit_allowed_hosts`](/reference/rest-api/domain/set-domain-config#body-properties-redirect-on-meeting-exit-allowed-hosts) domain property is set, this destination must be permitted by that allowlist, or the redirect is dropped and the participant is not redirected on leaving. This applies to [self-signed tokens](/docs/guides/privacy-and-security/self-signing-tokens) as well as tokens created through this API.
        lang:
          type: string
          description: >-
            The default language of the [Daily prebuilt video call
            UI](/products/prebuilt), for this room. 


            Setting the language at the token level will override any room or domain-level language settings you have.


            `*` Norwegian `"no"` and Russian `"ru"` are only available in the new Daily Prebuilt.


            See [language settings](/products/prebuilt/language) for all supported values and priority order.
          enum:
            - da
            - de
            - en
            - es
            - fi
            - fr
            - it
            - jp
            - ka
            - nl
            - no
            - pt
            - pt-BR
            - pl
            - ru
            - sv
            - tr
            - user
          default: en
        permissions:
          $ref: "#/components/schemas/permissions"
    domain_dialin_config_create_req:
      type: object
      description:
        the configuration object passed to the POST API that creates the
        dial-in config.
      required:
        - type
        - phone_number
      properties:
        type:
          type: string
          enum:
            - pin_dialin
            - pinless_dialin
          description: The type of dial-in configuration to create.
        phone_number:
          type: string
          example: "+12555599999"
          description:
            The phone number to configure for pinless_dialin or pin_dialin, in
            E.164 format (e.g. "+18058700061"). If the same number is used by
            any other config then the API will fail. Required for
            pinless_dialin, optional for pin_dialin.
        name_prefix:
          type: string
          example: my-identifier-prefix
          description: friendly name for the configuration.
        hmac:
          type: string
          example: 9jyatvPWQfBymCGDOYPYKF/TRZXR+08Gj4bvPF78pH0=
          description: The [HMAC
            signature](/guides/products/dial-in-dial-out/dialin-pinless#hmac)
            used to verify the webhook called to "room_creation_api". (only for
            pinless_dialin type)
        room_creation_api:
          type: string
          example: https://mydomain.com/api/create-room
          description: The API to request when a call is received on configured
            phoneNumber or sip_uri. (only for pinless_dialin type). flow is
            described
            [here](/guides/products/dial-in-dial-out/dialin-pinless#quick-overview)
        hold_music_url:
          type: string
          example: https://mydomain.com/hold-music.mp3
          description:
            The URL to the hold music to play when the call is received, (only
            for pinless_dialin type). The hold music must be a publicly
            accessible URL in MP3 format. The hold music must be less than 10MB
            in size and less than 60 seconds in duration. In pinless_dialin, the
            hold music will be played twice.
        timeout_config:
          type: object
          description: The timeout configuration for the dial-in config.
          properties:
            message:
              type: string
              example: No Agents are available right now, please try again later
              description:
                If room_creation_api does not respond within the timeout period,
                this message will be played to the caller.
        ivr_greeting:
          type: object
          description:
            configuration when the call is received on phone number (only for
            pin_dialin).
          properties:
            message:
              type: string
              example:
                Please enter the dialin code for the meeting, it is in the meeting
                invite
              description: The message to play when call first connects.
    domain_dialin_config_info_res:
      type: object
      properties:
        id:
          type: string
          example: 0cb313e1-211f-4be0-833d-8c7305b19902
          description:
            A unique, opaque ID for this object. You can use this ID in API
            calls, and in paginated list operations.
        type:
          type: string
          example: pinless_dialin
          description:
            describes the type of configuration. It can be pinless_dialin or
            pin_dialin.
          enum:
            - pinless_dialin
            - pin_dialin
        config:
          $ref: "#/components/schemas/domain_dialin_config_create_req"
    domain_dialin_config_update_req:
      type: object
      description:
        the configuration object passed to update an existing pinless or
        pin dial-in.
      properties:
        phone_number:
          type: string
          example: "+12555599999"
          description:
            The phone number to update to the existing dial-in config, in E.164
            format (e.g. "+18058700061"). If the same number is used by any
            other config then the API will fail.
        name_prefix:
          type: string
          example: my-identifier-prefix
          description: Update the name_prefix of an existing config.
        hmac:
          type: string
          example: 9jyatvPWQfBymCGDOYPYKF/TRZXR+08Gj4bvPF78pH0=
          description: The [HMAC
            signature](/guides/products/dial-in-dial-out/dialin-pinless#hmac)
            used to verify the webhook called to "room_creation_api". (only for
            pinless_dialin type).
        room_creation_api:
          type: string
          example: https://mydomain.com/api/create-room
          description:
            The URL to call when a call is received on configured phoneNumber
            or sip_uri. (only for pinless_dialin type). flow is described
            [here](/guides/products/dial-in-dial-out/dialin-pinless#quick-overview)
        hold_music_url:
          type: string
          example: https://mydomain.com/hold-music.mp3
          description:
            The URL to the hold music to play when the call is received, (only
            for pinless_dialin type). The hold music must be a publicly
            accessible URL in MP3 format. The hold music must be less than 10MB
            in size and less than 60 seconds in duration. In pinless_dialin, the
            hold music will be played twice.
        timeout_config:
          type: object
          description: The timeout configuration for the dial-in config.
          properties:
            message:
              type: string
              example: No Agents are available right now, please try again later
              description:
                If room_creation_api does not respond within the timeout period,
                this message will be played to the caller.
        ivr_greeting:
          type: object
          description:
            configuration when the call is received on phone number (only for
            pin_dialin).
          properties:
            message:
              type: string
              example:
                Please enter the dialin code for the meeting, it is in the meeting
                invite
              description: The message to play when call first connects.
    webhook:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        uuid:
          type: string
          description: The unique identifier for this webhook.
        url:
          type: string
          description: The webhook server endpoint that was provided.
        hmac:
          type: string
          description: A secret that can be used to verify the signature of the webhook.
        basicAuth:
          type: string
          description:
            The basic auth credentials that will be used to POST to the webhook
            URL.
        retryType:
          type: string
          description:
            The retry configuration for this webhook endpoint to use. The
            default is circuit-breaker.
          enum:
            - circuit-breaker
            - exponential
        eventTypes:
          description:
            The set of event types this webhook is subscribed to. Deliveries
            can be duplicated, and in rare cases a duplicate
            `participant.joined` or `participant.left` delivery carries a
            different `id` than the original. Deduplicate those two events on
            the event `type` plus the payload's `session_id` rather than on
            `id`. See the [webhooks overview](/reference/rest-api/webhooks) for
            details.
          type: array
          items:
            type: string
            enum:
              - recording.ready-to-download
              - recording.started
              - recording.error
              - streaming.started
              - streaming.updated
              - streaming.ended
              - streaming.error
              - streaming.warning
              - meeting.started
              - meeting.ended
              - participant.joined
              - participant.left
              - waiting-participant.joined
              - waiting-participant.left
              - batch-processor.job-finished
              - batch-processor.error
              - dialout.connected
              - dialout.error
              - dialout.stopped
              - dialout.warning
              - dialout.answered
              - dialin.ready
              - dialin.connected
              - dialin.error
              - dialin.stopped
              - dialin.warning
              - transcript.ready-to-download
              - transcript.started
              - transcript.error
              - calltransfer.triggered
              - calltransfer.initiated
              - calltransfer.answered
              - calltransfer.completed
        state:
          description: The current state of the webhook. "FAILED" | "ACTIVE"
          type: string
        failedCount:
          description: The number of consecutive failures this webhook has made.
          type: number
        lastMomentPushed:
          type: string
          description:
            The ISO 8601 time of the last moment an event was pushed to the
            webhook server.
        domainId:
          type: string
          description: The domain ID this webhook is associated with.
        createdAt:
          type: string
          description: The ISO 8601 time of when this webhook was created.
        updatedAt:
          type: string
          description: The ISO 8601 time of when this webhook was last updated.
    post_webhook:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          description: The webhook server endpoint that was provided.
        basicAuth:
          type: string
          description:
            The basic auth credentials that will be used to POST to the webhook
            URL.
        retryType:
          type: string
          description:
            The retry configuration for this webhook endpoint to use. The
