openapi: 3.0.0
info:
  title: Daily REST API
  version: v1
  description: >
    Minimal description of the subset of the Daily REST API used by this
    project: creating a room and reading its join URL.

    Daily rooms are persistent objects. A room is created once and remains
    joinable until its `exp` property is reached, at which point Daily deletes
    it automatically. Set `nbf` and `exp` (epoch seconds) to model a
    time-boxed meeting room.
servers:
  - url: https://api.daily.co/v1
    description: Production server
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Daily API key. Every request must send it as
        `Authorization: Bearer <key>`.
  schemas:
    Room:
      type: object
      required:
        - id
        - name
        - url
      properties:
        id:
          type: string
          description: The unique identifier of the room.
        name:
          type: string
          description: The name of the room.
        api_created:
          type: boolean
          description: Whether the room was created via the REST API.
        privacy:
          type: string
          enum:
            - public
            - private
          description: >
            `public` rooms can be joined by anyone with the URL. `private`
            rooms require a meeting token.
        url:
          type: string
          format: uri
          description: The URL participants use to join the room.
        created_at:
          type: string
          description: ISO 8601 timestamp of when the room was created.
        config:
          type: object
          additionalProperties: true
          description: The effective room properties.
paths:
  /rooms:
    post:
      summary: Create a room
      description: >
        Creates a room. If `name` is omitted (or already taken) Daily generates
        a unique name. The room is deleted automatically once `exp` is reached.
      requestBody:
        required: true
        description: Room to create.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: "[a-zA-Z0-9_-]+"
                  example: neuromancers-2f9c1b
                  description: >
                    The room name. Must be unique within the domain. If omitted,
                    Daily generates a unique name.
                privacy:
                  type: string
                  enum:
                    - public
                    - private
                  default: public
                  description: >
                    Join policy for the room. Defaults to `public`.
                properties:
                  type: object
                  additionalProperties: true
                  description: >
                    Room properties. Commonly used: `nbf` (epoch seconds before
                    which the room cannot be joined), `exp` (epoch seconds at
                    which the room is deleted) and `max_participants`.
      responses:
        "200":
          description: The created room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: The request was malformed.
        "401":
          description: The API key is missing or invalid.
        "429":
          description: You are rate limited.
