            `id`. See the [webhooks overview](/reference/rest-api/webhooks) for
            details.
          type: array
          items:
            type: string
            enum:
              - recording.ready-to-download
              - recording.started
              - recording.error
              - streaming.started
              - streaming.updated
              - streaming.ended
              - streaming.error
              - streaming.warning
              - meeting.started
              - meeting.ended
              - participant.joined
              - participant.left
              - waiting-participant.joined
              - waiting-participant.left
              - batch-processor.job-finished
              - batch-processor.error
              - dialout.connected
              - dialout.error
              - dialout.stopped
              - dialout.warning
              - dialout.answered
              - dialin.ready
              - dialin.connected
              - dialin.error
              - dialin.stopped
              - dialin.warning
              - transcript.ready-to-download
              - transcript.started
              - transcript.error
              - calltransfer.triggered
              - calltransfer.initiated
              - calltransfer.answered
              - calltransfer.completed
        hmac:
          type: string
          description:
            A secret that can be used to verify the signature of the webhook.
            If not provided, an hmac will be provisioned for you and returned.
