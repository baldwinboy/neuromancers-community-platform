volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}

  production_redis_data: {}
  production_bootstrap_state: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: neuromancers_network_production_django
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    environment:
      BWS_ACCESS_TOKEN: "${BWS_ACCESS_TOKEN}"
    command: /start
    volumes:
      - production_bootstrap_state:/var/lib/bootstrap

  django-init:
    <<: *django
    command:
      - /bin/sh
      - -c
      - >-
        if [ -x /start-init ]; then exec /start-init; fi;
        echo "start-init absent (pre-bootstrap image); legacy /start owns bootstrap";
        exit 0
    restart: "no"

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: neuromancers_network_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: neuromancers_network_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:5555:5555"

  redis:
    image: docker.io/redis:8.8

    volumes:
      - production_redis_data:/data

  celeryworker:
    <<: *django
    image: neuromancers_network_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: neuromancers_network_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: neuromancers_network_production_flower
    command: /start-flower

  awscli:
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_postgres_data_backups:/backups:z
