# tsdproxy List provider: only django and monitor are proxied here.
# Each key becomes the Tailscale VIP Service FQDN (e.g. staging.<tailnet>.ts.net).
# paas (Coolify) is served by the host's own Tailscale instance, not tsdproxy.
__TS_STAGE__: # django application (Host preserved == TS_APP_DOMAIN)
  ports:
    443/https:
      targets:
        - http://django:5000
__TS_STAGE__-monitor: # Gatus status page / uptime monitoring
  ports:
    443/https:
      targets:
        - http://gatus:8080
