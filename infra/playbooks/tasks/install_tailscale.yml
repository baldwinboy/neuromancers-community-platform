# Install Tailscale
---
- name: Install Tailscale package
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Update Tailscale package to latest
  ansible.builtin.apt:
    name: tailscale
    state: latest

- name: Ensure tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Assert Tailscale credentials are available
  ansible.builtin.assert:
    that:
      - tailscale_oauth_client_secret is defined
      - tailscale_tag is defined
    fail_msg: >-
      Tailscale credentials are missing. TS_OAUTH_CLIENT_SECRET and
      TAILSCALE_TAG must be provided (normally injected from Bitwarden
      Secrets Manager via `bws run`) before the host can join the tailnet.
    quiet: true
  become: true

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false
  become: true

- name: Parse current Tailscale state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{
        (tailscale_status_raw.stdout | from_json).BackendState
        if (tailscale_status_raw.stdout | default('') | length > 0)
        else 'Stopped'
      }}

- name: Set Tailscale stage name
  ansible.builtin.set_fact:
    tailscale_stage: "{{ 'staging' if git_environment == 'staging' else 'production' }}"

# "Reachable but not joined" (e.g. NeedsLogin) is possible, so gate on the
# parsed backend state rather than the command's exit code.
- name: Join tailnet if not already running
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ tailscale_oauth_client_secret }}
    --advertise-tags={{ tailscale_tag }}
    --hostname=neuromancers-network-{{ tailscale_stage }}
    --ssh
    --reset
  register: tailscale_join
  changed_when: tailscale_join.rc == 0
  when: tailscale_backend_state != 'Running'
  become: true
  no_log: true

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status
  register: next_tailscale_status
  changed_when: false
  failed_when: false
  become: true

- name: Check current Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_after
  changed_when: false
  failed_when: false
  become: true

- name: Parse Tailscale backend state after join
  ansible.builtin.set_fact:
    tailscale_backend_state_after: >-
      {{
        (tailscale_status_after.stdout | from_json).BackendState
        if (tailscale_status_after.stdout | default('') | length > 0)
        else 'Unknown'
      }}

- name: Assert the host joined the tailnet
  ansible.builtin.assert:
    that:
      - tailscale_backend_state_after == 'Running'
    fail_msg: >-
      The host did not join the tailnet (BackendState:
      {{ tailscale_backend_state_after }}).
      `tailscale status` output:
      {{ next_tailscale_status.stdout | default('(no stdout)') }}
      {{ next_tailscale_status.stderr | default('') }}
    success_msg: "Host is connected to the tailnet."
    quiet: true
  become: true

- name: Get the Tailscale DNS configuration
  ansible.builtin.command: tailscale dns status --json
  register: tailscale_dns_status
  failed_when: next_tailscale_status.rc != 0
  become: true

- name: Parse the Tailscale DNS configuration
  ansible.builtin.set_fact:
    tailscale_dns_config: "{{ tailscale_dns_status.stdout | from_json }}"

- name: Get MagicDNS hostname
  ansible.builtin.set_fact:
    tailscale_dns_hostname: "{{ tailscale_dns_config.CurrentTailnet.MagicDNSSuffix }}"

- name: Set application and paas domains
  ansible.builtin.set_fact:
    tailscale_app_domain: "{{ tailscale_stage }}.{{ tailscale_dns_hostname }}"
    tailscale_paas_domain: "{{ tailscale_stage }}-paas.{{ tailscale_dns_hostname }}"

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop:
    - /certs/paas/
    - /etc/tailscale

- name: Serve Coolify instance on tailnet
  ansible.builtin.shell: |
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --http=80 --yes localhost:{{ coolify_port }}
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --https=443 --yes localhost:{{ coolify_port }}
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --https=6001 --yes localhost:6001
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --https=6002 --yes localhost:6002
  become: true

- name: Generate Tailscale certificates for Coolify
  ansible.builtin.shell: |
    tailscale cert --cert-file /certs/paas/cert.pem --key-file /certs/paas/key.pem {{ tailscale_paas_domain }}
  args:
    creates: /certs/paas/cert.pem
  become: true

- name: Check if cert-refreshed-at file exists
  ansible.builtin.stat:
    path: /etc/tailscale/cert-refreshed-at.txt
  register: cert_refreshed_at_stat
  become: true

- name: Write current date to file
  ansible.builtin.copy:
    content: "{{ ansible_date_time.epoch }}"
    dest: /etc/tailscale/cert-refreshed-at.txt
    mode: "0644"
  when: not cert_refreshed_at_stat.stat.exists
  become: true
