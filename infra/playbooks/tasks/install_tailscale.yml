# Install Tailscale
---
- name: Install Tailscale package
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Update Tailscale package to latest
  ansible.builtin.apt:
    name: tailscale
    state: latest

- name: Ensure tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false
  become: true

- name: Set Tailscale stage name
  ansible.builtin.set_fact:
    tailscale_stage: "{{ 'staging' if git_environment == 'staging' else 'production' }}"

- name: Join tailnet if not already connected
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ tailscale_oauth_client_secret }}
    --advertise-tags={{ tailscale_tag }}
    --hostname=neuromancers-network-{{ tailscale_stage }}
    --ssh
    --reset
  register: tailscale_join
  when: tailscale_status.rc != 0 and tailscale_oauth_client_secret is defined and tailscale_tag is defined
  become: true

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status
  register: next_tailscale_status
  changed_when: false
  failed_when: false
  become: true

- name: Get the Tailscale DNS configuration
  ansible.builtin.command: tailscale dns status --json
  register: tailscale_dns_status
  failed_when: next_tailscale_status.rc != 0
  become: true

- name: Parse the Tailscale DNS configuration
  ansible.builtin.set_fact:
    tailscale_dns_config: "{{ tailscale_dns_status.stdout | from_json }}"

- name: Get MagicDNS hostname
  ansible.builtin.set_fact:
    tailscale_dns_hostname: "{{ tailscale_dns_config.CurrentTailnet.MagicDNSSuffix }}"

- name: Set application and paas domains
  ansible.builtin.set_fact:
    tailscale_app_domain: "{{ tailscale_stage }}.{{ tailscale_dns_hostname }}"
    tailscale_paas_domain: "{{ tailscale_stage }}-paas.{{ tailscale_dns_hostname }}"

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop:
    - /certs/paas/
    - /etc/tailscale

- name: Serve Coolify instance on tailnet
  ansible.builtin.shell: |
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --http=80 --yes localhost:{{ coolify_port }}
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --https=443 --yes localhost:{{ coolify_port }}
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --https=6001 --yes localhost:6001
    tailscale serve --bg --service="svc:{{ tailscale_stage }}-paas" --https=6002 --yes localhost:6002
  become: true

- name: Generate Tailscale certificates for Coolify
  ansible.builtin.shell: |
    tailscale cert --cert-file /certs/paas/cert.pem --key-file /certs/paas/key.pem {{ tailscale_paas_domain }}
  args:
    creates: /certs/paas/cert.pem
  become: true

- name: Check if cert-refreshed-at file exists
  ansible.builtin.stat:
    path: /etc/tailscale/cert-refreshed-at.txt
  register: cert_refreshed_at_stat
  become: true

- name: Write current date to file
  ansible.builtin.copy:
    content: "{{ ansible_date_time.epoch }}"
    dest: /etc/tailscale/cert-refreshed-at.txt
    mode: "0644"
  when: not cert_refreshed_at_stat.stat.exists
  become: true
