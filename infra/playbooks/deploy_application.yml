- name: Deploy Application
  hosts: all
  become: true
  collections:
    - community.general
    - community.crypto
    - community.docker
    - ansible.posix

  tasks:
    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - git_branch is defined
          - git_branch in ['main', 'staging']
          - git_commit_sha is defined
          - git_commit_sha is string
          - git_commit_sha is match('^[0-9a-f]{40}$')
          - git_environment is defined
          - git_environment in ['production', 'staging']
          - (git_environment == 'production') == (git_branch == 'main')
          - postgres_tag is defined
          - postgres_tag is string
          - postgres_tag is match('^postgres-[0-9a-f]{40}$')
        fail_msg: >-
          Invalid deployment inputs. Required: git_branch (main|staging),
          git_commit_sha (40 lowercase hex), git_environment (production|staging),
          and postgres_tag (postgres-<40 lowercase hex>).

    # Preflight check
    - name: Check if Coolify API is enabled
      ansible.builtin.uri:
        url: "{{ coolify_healthcheck_url }}"
        method: GET
      register: coolify_health

    - name: Set Coolify API token
      ansible.builtin.set_fact:
        coolify_api_token: "{{ coolify_admin_token | default(lookup('env', 'COOLIFY_ADMIN_TOKEN', default='')) }}"
      when: coolify_health.status == 200
      no_log: true

    - name: Set BWS access token
      ansible.builtin.set_fact:
        bws_access_token: "{{ BWS_ACCESS_TOKEN | default(lookup('env', 'BWS_ACCESS_TOKEN', default='')) }}"
      when: coolify_health.status == 200
      no_log: true

    - name: Assert Coolify API and tokens are available
      ansible.builtin.assert:
        that:
          - (coolify_health.status | default(0)) == 200
          - (coolify_api_token | default('') | length) > 0
          - (bws_access_token | default('') | length) > 0
        fail_msg: >-
          Coolify API is not healthy or the required API/Bitwarden tokens are
          missing. Check COOLIFY_ADMIN_TOKEN and BWS_ACCESS_TOKEN.

    - name: Set Docker image tag
      ansible.builtin.set_fact:
        docker_tag: "{{ git_commit_sha }}"

    # Get the Coolify host server as JSON
    - name: List Coolify servers
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/servers"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_server_list

    - name: Get Coolify host server object
      ansible.builtin.set_fact:
        coolify_server: "{{ coolify_server_list.json | selectattr('is_coolify_host') | selectattr('is_reachable') | first | default('') }}"
      when: coolify_server_list is defined
      failed_when: coolify_server == ''

    # Get or create `neuromancers` project
    - name: List Coolify projects
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/projects"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_project_list
      retries: 3
      delay: 2

    - name: Get `neuromancers` project
      ansible.builtin.set_fact:
        coolify_project: "{{ coolify_project_list.json | selectattr('name', 'eq', 'neuromancers') | first | default('') }}"
      when: coolify_project_list is defined

    - name: Create `neuromancers` project if not exists
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/projects"
        method: POST
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        return_content: true
        body_format: json
        body:
          name: "neuromancers"
          description: "NEUROMANCERS Network"
        status_code: 201
      register: created_coolify_project
      when: not coolify_project

    - name: Set project UUID from existing project
      ansible.builtin.set_fact:
        coolify_project_uuid: "{{ coolify_project.uuid }}"
      when: (coolify_project | default('')) != ''

    - name: Set project UUID from created project
      ansible.builtin.set_fact:
        coolify_project_uuid: "{{ created_coolify_project.json.uuid }}"
      when: (coolify_project | default('')) == ''

    # Get or create environment for `neuromancers` project
    - name: List Coolify environments
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/projects/{{ coolify_project_uuid }}/environments"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_environment_list
      retries: 3
      delay: 2

    - name: Get `neuromancers` environment
      ansible.builtin.set_fact:
        coolify_environment: "{{ coolify_environment_list.json | selectattr('name', 'eq', 'neuromancers') | first | default('') }}"
      when: coolify_environment_list is defined

    - name: Create `neuromancers` environment if not exists
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/projects/{{ coolify_project_uuid }}/environments"
        method: POST
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        return_content: true
        body_format: json
        body:
          name: "neuromancers"
        status_code: 201
      register: created_coolify_environment
      when: not coolify_environment

    # Get or create application for `neuromancers` environment
    - name: List Coolify applications
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/applications"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_application_list
      retries: 3
      delay: 2

    - name: Get `neuromancers_network` application
      ansible.builtin.set_fact:
        coolify_application: "{{ coolify_application_list.json | selectattr('name', 'eq', 'neuromancers_network') | first | default('') }}"
      when: coolify_application_list is defined

    - name: Create `neuromancers_network` application if not exists
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/applications/public"
        method: POST
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        return_content: true
        body_format: json
        body:
          project_uuid: "{{ coolify_project_uuid }}"
          server_uuid: "{{ coolify_server.uuid }}"
          environment_name: "neuromancers"
          git_repository: "{{ git_repository }}"
          git_branch: "{{ git_branch }}"
          build_pack: "dockercompose"
          ports_exposes: "5000"
          ports_mappings: "80:5000"
          name: "neuromancers_network"
          description: "NEUROMANCERS Network"
          instant_deploy: false
          is_auto_deploy_enabled: false
          git_commit_sha: "{{ git_commit_sha }}"
          docker_compose_location: "/docker-compose.coolify.yml"
          health_check_enabled: true
          health_check_path: "/api/health"
          health_check_port: "5000"
          health_check_method: "GET"
          health_check_return_code: 200
          health_check_interval: 10
          health_check_timeout: 5
          health_check_retries: 12
          health_check_start_period: 300
        status_code: 201
      register: created_coolify_application
      when: not coolify_application

    - name: Set application UUID from existing application
      ansible.builtin.set_fact:
        coolify_application_uuid: "{{ coolify_application.uuid }}"
      when: (coolify_application | default('')) != ''

    - name: Set application UUID from created application
      ansible.builtin.set_fact:
        coolify_application_uuid: "{{ created_coolify_application.json.uuid }}"
      when: (coolify_application | default('')) == ''

    - name: Assert Coolify application UUID is available
      ansible.builtin.assert:
        that:
          - (coolify_application_uuid | default('') | length) > 0
        fail_msg: "Coolify did not return an application UUID."

    - name: Converge Coolify application source settings
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/applications/{{ coolify_application_uuid }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        body_format: json
        body:
          git_branch: "{{ git_branch }}"
          is_auto_deploy_enabled: false
        status_code: 200

    # Get existing env vars
    - name: List existing envs for application
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/applications/{{ coolify_application_uuid }}/envs"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_application_envs
      when: coolify_application_uuid | default('') != ''

    - name: Set existing env vars fact
      ansible.builtin.set_fact:
        coolify_env_vars: "{{ coolify_application_envs.json | default([]) }}"
      when: coolify_application_envs is defined and coolify_application_envs.status == 200
      no_log: true

    - name: Set Github secrets for Coolify
      ansible.builtin.set_fact:
        github_secrets:
          - key: "BWS_ACCESS_TOKEN"
            value: "{{ bws_access_token }}"
            is_preview: false
            is_literal: true
          - key: "DOCKER_TAG"
            value: "{{ docker_tag }}"
            is_preview: false
            is_literal: true
          - key: "POSTGRES_TAG"
            value: "{{ postgres_tag }}"
            is_preview: false
            is_literal: true
          - key: "TS_APP_DOMAIN"
            value: "{{ tailscale_app_domain }}"
            is_preview: false
            is_literal: true
          - key: "TS_PAAS_DOMAIN"
            value: "{{ tailscale_paas_domain }}"
            is_preview: false
            is_literal: true
          - key: "TAILSCALE_TAG"
            value: "{{ tailscale_tag }}"
            is_preview: false
            is_literal: true
          - key: "TS_OAUTH_CLIENT_ID"
            value: "{{ tailscale_oauth_client_id }}"
            is_preview: false
            is_literal: true
          - key: "TS_OAUTH_CLIENT_SECRET"
            value: "{{ tailscale_oauth_client_secret }}"
            is_preview: false
            is_literal: true
      when: coolify_env_vars is defined and bws_access_token is defined and docker_tag is defined
      no_log: true

    # Get secrets from Bitwarden
    - name: Resolve secrets from Bitwarden Secrets Manager
      ansible.builtin.shell: bws secret list | jq -r '[.[] | {key:.key,value:.value,is_preview:false,is_literal:true}]'
      environment:
        BWS_ACCESS_TOKEN: "{{ bws_access_token }}"
      register: bws_secrets_raw
      when: bws_access_token | default('') != ''
      no_log: true

    - name: Parse BWS secrets
      ansible.builtin.set_fact:
        bws_secrets: "{{ (bws_secrets_raw.stdout | from_json) if bws_secrets_raw is defined and bws_secrets_raw.stdout is defined else [] }}"
      when: coolify_env_vars is defined
      no_log: true

    # Refresh secrets: only update keys that already exist in Coolify.
    # New secrets must be added manually by a developer via the Coolify UI.
    # See docs/infra/operator-guide.md#first-deployment for the manual setup.
    - name: Filter Bitwarden secrets for Coolify
      ansible.builtin.set_fact:
        filtered_bws_secrets: "{{ bws_secrets | selectattr('key', 'in', coolify_env_vars | map(attribute='key')) | list }}"
      when: coolify_env_vars is defined and bws_secrets is defined
      no_log: true

    - name: Set list of env items
      ansible.builtin.set_fact:
        env_items: "{{ filtered_bws_secrets + github_secrets }}"
      when: filtered_bws_secrets is defined and github_secrets is defined
      no_log: true

    - name: Update Coolify env vars
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/applications/{{ coolify_application_uuid }}/envs/bulk"
        method: PATCH
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        body_format: json
        body:
          data: "{{ env_items }}"
        status_code: 201
      when:
        - coolify_application_uuid | default('') != ''
        - env_items | default([]) | length > 0
      no_log: true

    # Deploy application
    - name: Deploy application
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/deploy"
        method: POST
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        body_format: json
        body:
          uuid: "{{ coolify_application_uuid }}"
        status_code: 200
        return_content: true
      register: coolify_deploy_result
      when:
        - coolify_application_uuid | default('') != ''

    # Get deployment UUID
    - name: Get deployment UUID
      ansible.builtin.set_fact:
        coolify_deployment_uuid: "{{ coolify_deploy_result.json.deployments[0].deployment_uuid | default('') }}"
      when: >-
        coolify_deploy_result is defined
        and (coolify_deploy_result.json.deployments | default([]) | length) > 0

    - name: Assert Coolify queued a deployment
      ansible.builtin.assert:
        that:
          - coolify_deploy_result is defined
          - (coolify_deploy_result.json.deployments | default([]) | length) > 0
          - (coolify_deployment_uuid | default('') | length) > 0
        fail_msg: "Coolify did not return a deployment UUID; refusing to report success."

    - name: Wait for deployment to complete
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/deployments/{{ coolify_deployment_uuid }}"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_deployment_result
      retries: 12
      delay: 60
      until: >-
        ((coolify_deployment_result.json | default({})).status | default('unknown'))
        in ['failed', 'finished', 'cancelled-by-user']
      failed_when: false
      when: coolify_deployment_uuid | default('') != ''

    # Surface the Coolify deployment logs when it did not finish successfully
    - name: Show Coolify deployment logs
      ansible.builtin.debug:
        msg: "{{ ((coolify_deployment_result.json.logs | from_json) | map(attribute='output') | select('string') | list)[-120:] }}"
      when: >-
        coolify_deployment_result is defined
        and ((coolify_deployment_result.json | default({})).status | default('unknown')) != 'finished'
        and (coolify_deployment_result.json | default({})).logs is defined
        and (coolify_deployment_result.json | default({})).logs is string

    # Exit if Coolify deployment did not finish successfully
    - name: Fail if Coolify deployment failed
      ansible.builtin.fail:
        msg: >-
          Coolify deployment did not finish successfully (status:
          {{ (coolify_deployment_result.json | default({})).status | default('unknown') }}).
          Check the deployment logs printed above.
      when: >-
        coolify_deployment_uuid | default('') != ''
        and ((coolify_deployment_result.json | default({})).status | default('unknown')) != 'finished'

    - name: Read deployed Coolify application
      ansible.builtin.uri:
        url: "{{ coolify_api_url }}/applications/{{ coolify_application_uuid }}"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: 200
        return_content: true
      register: coolify_application_after
      when: coolify_application_uuid | default('') != ''

    - name: Assert Coolify deployed the validated source revision
      ansible.builtin.assert:
        that:
          - coolify_application_after.json.git_commit_sha == git_commit_sha
        fail_msg: >-
          Coolify deployed source
          {{ coolify_application_after.json.git_commit_sha | default('unknown') }},
          expected {{ git_commit_sha }}. A newer push may have landed during
          deployment.
      when:
        - coolify_application_uuid | default('') != ''
        - verify_source_sha | default(true) | bool

    - name: Assert running containers use the deployed image tags
      ansible.builtin.command:
        cmd: "docker ps --format '{% raw %}{{.Image}}{% endraw %}'"
      register: running_images
      changed_when: false
      retries: 12
      delay: 10
      until: >-
        (running_images.stdout_lines | select('search', ':' ~ git_commit_sha) | list | length) >= 3 and
        (running_images.stdout_lines | select('search', ':' ~ postgres_tag) | list | length) >= 1

    - name: Find running Django container for this revision
      ansible.builtin.command:
        cmd: >-
          docker ps -q
          --filter "label=com.docker.compose.service=django"
          --filter "ancestor=ghcr.io/baldwinboy/neuromancers-network:{{ git_commit_sha }}"
      register: django_container_id
      changed_when: false
      retries: 12
      delay: 10
      until: django_container_id.stdout_lines | length > 0

    - name: Assert health endpoint reports the deployed revision
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ django_container_id.stdout_lines[0] }}"
          - python
          - -c
          - >-
            import json,urllib.request;
            data=json.load(urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5));
            assert data.get('revision') == '{{ git_commit_sha }}', data
      register: health_revision
      changed_when: false
      retries: 12
      delay: 10
      until: health_revision.rc == 0
      when: require_health_revision | default(true) | bool
