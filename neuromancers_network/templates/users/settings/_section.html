{% load i18n allauth_ui %}

<div id="settings-section-{{ key }}" class="space-y-4">
  {% if saved %}
    <div class="alert alert-success">{% trans "Your settings have been saved." %}</div>
  {% endif %}
  <form method="post"
        action="{{ request.path }}"
        enctype="multipart/form-data"
        hx-post="{{ request.path }}"
        hx-target="#settings-section-{{ key }}"
        hx-swap="outerHTML"
        class="space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-error">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
      <div class="form-control w-full">{% daisie_form_field field %}</div>
    {% endfor %}
    {{ form.media }}
    <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
  </form>
</div>
