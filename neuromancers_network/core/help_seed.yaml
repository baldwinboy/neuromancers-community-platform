  - title: "Meeting provider pricing: Whereby vs Daily"
    slug: meeting-provider-pricing
    category: developers-operators
    kind: reference
    audience: developer
    summary: Usage-based pricing comparison for Whereby Embedded and Daily Video SDK.
    body:
      - type: rich_text
        text: |-
          <p>This compares the API products used by the platform: <strong>Whereby Embedded (Build)</strong> and <strong>Daily Video SDK</strong>. Prices are in USD, excluding VAT, and were checked on 19 October 2026. Re-check the providers' pricing pages before committing to a plan.</p>
      - type: table
        headers: ["Cost line", "Daily Video SDK", "Whereby Embedded (Build)"]
        rows:
          - ["Monthly platform fee", "$0 (pay-as-you-go)", "$10.99/month"]
          - [
              "Included participant minutes",
              "10,000/month free",
              "2,000/month included",
            ]
          - [
              "Additional participant minute",
              "$0.0040 (10,001–100,000; graduated to $0.0015 at 50M+)",
              "$0.0042",
            ]
          - [
              "Cloud recording",
              "$0.01349/recorded min + $0.003/min storage",
              "$0.01/recorded min",
            ]
          - [
              "Transcription",
              "$0.0059/unmuted participant min realtime; $0.0043/recorded min post-call",
              "From $0.0065/unmuted participant min; $0.024/recorded min",
            ]
          - ["Live streaming", "$0.015/min RTMP; $0.03/min HLS", "$0.01/min"]
          - [
              "Included storage",
              "None listed; recording storage $0.003/min",
              "30 GB-days; then $0.0015/GB-day",
            ]
          - ["HIPAA", "$500/month add-on", "$16.99/month add-on"]
          - [
              "Scale limits",
              "Up to 100,000 concurrent calls with a card on file",
              "200 participants, 24 active videos",
            ]
          - [
              "Support",
              "Free developer support; enterprise SLAs",
              "Email, 1 business day; enterprise TSM",
            ]
      - type: header
        text: Worked examples
      - type: rich_text
        text: |-
          <p>Billing is by <strong>participant-minute</strong>: participants multiplied by minutes. Group sessions therefore cost more than the same duration with one other person.</p>
      - type: rich_text
        text: |-
          <p>At 10,000 participant-minutes per month, Daily costs <strong>$0</strong> and Whereby Build costs <strong>$44.59</strong> ($10.99 + 8,000 × $0.0042). At 50,000 participant-minutes, Daily costs <strong>$160.00</strong> and Whereby Build costs <strong>$212.59</strong> ($10.99 + 48,000 × $0.0042).</p>
      - type: header
        text: Notes
      - type: rich_text
        text: |-
          <ul><li>Whereby's Build plan includes 2,000 participant minutes; the free Explore tier also has 2,000 minutes but no premium features.</li><li>Whereby Meetings per-user plans are not the pricing used by this API integration.</li><li>Daily's rates fall automatically as monthly participant-minute volume grows.</li><li>Storage, recording, transcription and HIPAA add-ons can change the effective monthly cost.</li></ul>
    steps: []
    sort_order: 13
    is_published: true

  - title: Review approval and hiding
    slug: review-approval-and-hiding
    category: care-providers
    kind: howto
    audience: peer
    summary: Choose whether reviews need approval, then approve or hide them (never delete).
    body:
      - type: rich_text
        text: |-
          <p>When <strong>Reviews require approval</strong> is on in your peer profile, new reviews arrive as <em>Pending approval</em> and are not public until you approve them. When it is off, reviews publish immediately. You can also refuse reviews entirely with <strong>Accepts reviews</strong>.</p>
      - type: rich_text
        text: |-
          <p>You can hide any review. Hiding never deletes it, and hidden reviews stop appearing on public surfaces. Moderators can additionally unpublish a review (both actions end in the same hidden state, and the actor is audited).</p>
      - type: header
        text: Where to act
      - type: rich_text
        text: |-
          <p>Use the <strong>My reviews</strong>, <strong>My pending reviews</strong> and <strong>My hidden reviews</strong> feeds on your dashboard, with the <strong>Approve review</strong> and <strong>Hide review</strong> action buttons.</p>
    steps:
      - text: Choose whether reviews require approval and whether you accept reviews.
      - text: Review pending items from My pending reviews.
      - text: Approve to publish, or hide to remove a review from public surfaces.
    sort_order: 30
    is_published: true

  - title: Joining a meeting
    slug: joining-a-meeting
    category: care-seekers
    kind: howto
    audience: seeker
    summary: When the join link opens, the difference between host and guest links, and why the server checks it.
    body:
      - type: rich_text
        text: |-
          <p>The join link opens only inside the <strong>join window</strong>: it becomes available a configurable number of minutes before the session (set by <strong>Join window lead</strong> in Integration Settings) and closes when the session ends. The button is cosmetic; the join endpoint re-checks your role and the window on the server.</p>
      - type: rich_text
        text: |-
          <p>Hosts and guests receive different links. With Whereby, host links are fetched on demand and guest links use the stored room URL. With Daily, rooms are private and each link includes a short-lived meeting token, so a copied link cannot be reused outside the window.</p>
    steps:
      - text: Open the session from your bookings or the reminder email inside the join window.
      - text: If the link is not open yet, wait for the window (or contact the host).
    sort_order: 20
    is_published: true

  - title: Who can see bookings and refunds
    slug: who-can-see-bookings-and-refunds
    category: care-seekers
    kind: reference
    audience: seeker
    summary: Bookings and refunds are private two-party records, not public content.
    body:
      - type: rich_text
        text: |-
          <p>A <strong>booking</strong> and a <strong>refund request</strong> are private two-party records. Only the seeker, the care provider whose meeting was booked, and moderators may open their detail pages or see them in feeds. Everyone else gets a 404 (detail page) or an empty feed.</p>
      - type: rich_text
        text: |-
          <p>Moderators can view these records for support, but they are not participants. Detail pages are generated automatically and are never navigable by other members.</p>
    steps: []
    sort_order: 21
    is_published: true

  - title: Searching the site
    slug: searching-the-site
    category: care-seekers
    kind: howto
    audience: seeker
    summary: What search covers and how visibility affects results.
    body:
      - type: rich_text
        text: |-
          <p>The Search page looks across published meetings, approved care providers, and pages whose title, description or body match your query. Results are ordered deterministically and paginated.</p>
      - type: rich_text
        text: |-
          <p>Search respects visibility: unpublished meetings, ineligible or hidden providers, and pending or hidden reviews never appear. Pair search with the tag, language and country filters on feeds to narrow results.</p>
    steps: []
    sort_order: 22
    is_published: true

  - title: Reading the analytics dashboard
    slug: reading-the-analytics-dashboard
    category: administrators-moderation-operations
    kind: reference
    audience: admin
    summary: The staff-only metrics dashboard, its periods and its read-only API.
    body:
      - type: rich_text
        text: |-
          <p><strong>Analytics</strong> is staff-only. Choose a UTC calendar period: this month, last month, the last three months, or all time.</p>
      - type: header
        text: Metrics
      - type: rich_text
        text: |-
          <p>Revenue is shown split into <strong>marketplace</strong> (application fees) and <strong>subscription</strong> revenue, with a combined total. The dashboard also shows gross booking value, payments, take rate, refunds and refund rate, disputes, average order value, active members and peers, repeat-booking rate, published-review rate, session minutes by provider, GBV per currency and a converted total, and requests/bookings by status.</p>
      - type: header
        text: Read-only API
      - type: rich_text
        text: |-
          <p><code>/api/analytics/platform</code> returns platform metrics to staff. <code>/api/analytics/me</code> returns the signed-in member's own spend/refund totals (and a peer view for providers). Both accept <code>?period=</code> with the same period names.</p>
    steps:
      - text: Open Analytics from the admin menu.
      - text: Choose a period to change every figure on the page.
      - text: Use the API for exports or reporting that should not depend on the UI.
    sort_order: 30
    is_published: true

  - title: Scripts and cookie consent
    slug: scripts-and-cookie-consent
    category: administrators-getting-started
    kind: howto
    audience: admin
    summary: Add head/body scripts, gate them by consent and audience, and publish the cookie policy.
    body:
      - type: rich_text
        text: |-
          <p><strong>Script Settings</strong> lets you add scripts to the site head or body. Each script has a category (<em>necessary</em>, <em>analytics</em> or <em>marketing</em>) and an optional audience. Only <em>necessary</em> scripts render before the visitor consents; the others wait for the matching category in the consent cookie.</p>
      - type: rich_text
        text: |-
          <p><strong>Consent Settings</strong> holds the banner title, text, button labels and the <strong>policy version</strong>. Bump the version when the policy changes and visitors are asked again. The <strong>Cookies</strong> snippet registry lists each cookie (name, provider, purpose, duration, category); add the <strong>Cookie registry</strong> block to an admin-authored policy page to render it. Necessary cookies such as the session, CSRF, language and theme cookies are registered for you.</p>
    steps:
      - text: Add each script in Script Settings with its category, placement and audience.
      - text: Author the policy page and insert the Cookie registry block.
      - text: Update the banner copy and bump the policy version when the policy changes.
    sort_order: 30
    is_published: true

