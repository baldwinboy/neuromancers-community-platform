name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ["main", "staging"]
    paths-ignore: ["docs/**"]

  push:
    branches: ["main", "staging"]
    paths-ignore: ["docs/**"]

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Detect application changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'neuromancers_network/**'
              - 'config/**'
              - 'locale/**'
              - 'getpronto/**'
              - 'whereby/**'
              - 'manage.py'
              - 'merge_production_dotenvs_in_dotenv.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'package.json'
              - 'package-lock.json'
              - 'compose/production/django/**'
              - 'compose/production/postgres/**'
              - 'docker-compose.production.yml'

  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neuromancers_network
          POSTGRES_USER: debug
          POSTGRES_PASSWORD: debug
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://debug:debug@localhost:5432/neuromancers_network
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run DB Migrations
        run: uv run python manage.py migrate

  docker:
    needs: [changes, linter, migrations]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/bake-action@v7
        with:
          push: true
          files: docker-compose.production.yml
          targets: django,postgres
          set: |
            django.tags=ghcr.io/${{ github.repository_owner }}/neuromancers-network:${{ github.sha }}
            django.tags=ghcr.io/${{ github.repository_owner }}/neuromancers-network:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            postgres.tags=ghcr.io/${{ github.repository_owner }}/neuromancers-network-postgres:${{ github.sha }}
            postgres.tags=ghcr.io/${{ github.repository_owner }}/neuromancers-network-postgres:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
